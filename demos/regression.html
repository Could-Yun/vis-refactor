<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linear regression · 线性回归</title><link rel="stylesheet" href="../assets/css/portal.css"><body><main class="section"><a href="./">← Demo</a><h1><span data-lang="zh-CN">散点与线性回归</span><span data-lang="en-US" hidden>Scatter and linear regression</span></h1><p data-lang="zh-CN">拖动任意数据点，观察最小二乘拟合线如何改变。相关不等于因果。</p><p data-lang="en-US" hidden>Drag a point to update the least-squares fit. Correlation is not causation.</p><svg id="regression" viewBox="0 0 700 400" style="width:100%;max-width:900px"></svg><p id="fit"></p></main><script src="../assets/vendor/d3.v7.min.js"></script><script>window.baseD3=window.d3;</script><script src="../assets/vendor/d3-regression.min.js"></script><script>Object.assign(window.baseD3,window.d3);window.d3=window.baseD3;delete window.baseD3;</script><script type="module" src="../assets/js/i18n.js"></script><script>
const points=[{x:8,y:3},{x:2,y:10},{x:11,y:3},{x:6,y:6},{x:5,y:8},{x:4,y:12},{x:12,y:1},{x:9,y:4},{x:6,y:9},{x:1,y:14}];const svg=d3.select('#regression'),x=d3.scaleLinear().domain([0,14]).range([45,670]),y=d3.scaleLinear().domain([0,16]).range([350,20]);svg.append('g').attr('transform','translate(0,350)').call(d3.axisBottom(x));svg.append('g').attr('transform','translate(45,0)').call(d3.axisLeft(y));const line=svg.append('path').attr('stroke','#4338ca').attr('stroke-width',3).attr('fill','none');const dots=svg.selectAll('circle').data(points).join('circle').attr('r',7).attr('fill','#0ea5e9').style('cursor','grab').call(d3.drag().on('drag',(e,d)=>{d.x=x.invert(Math.max(45,Math.min(670,e.x)));d.y=y.invert(Math.max(20,Math.min(350,e.y)));paint();}));function paint(){dots.attr('cx',d=>x(d.x)).attr('cy',d=>y(d.y));const fit=d3.regressionLinear().x(d=>d.x).y(d=>d.y).domain([0,14])(points);line.attr('d',d3.line().x(d=>x(d[0])).y(d=>y(d[1]))(fit));document.querySelector('#fit').textContent='y = '+fit.a.toFixed(3)+'x + '+fit.b.toFixed(3)+' · R² = '+fit.rSquared.toFixed(3);}paint();</script></body></html>
